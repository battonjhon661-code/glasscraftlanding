<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Referral Card</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;600;800&display=swap"
    rel="stylesheet"
  >

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --bg: #0C0C0B;
      --fg: #EDEDE8;
      --muted: #93938F;

      --border: rgba(237,237,232,0.09);
      --border-hover: rgba(237,237,232,0.38);

      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--fg);

      font-family: 'Inter', sans-serif;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 16px;

      overflow: hidden;
    }

    /* =========================
       CARD
    ========================= */

    .pcard {
      width: 100%;
      max-width: 1600px;

      border: 1px solid var(--border);
      border-radius: var(--radius);

      overflow: hidden;

      opacity: 0;
      transform: translateY(80px);

      transition:
        border-color 0.4s ease,
        transform 0.4s ease;
    }

    .pcard:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .pcard-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;

      min-height: 400px;
    }

    /* =========================
       LEFT
    ========================= */

    .pcard-info {
      padding: 40px 44px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      gap: 20px;
    }

    .pcard-top {
      display: flex;
      align-items: center;
      gap: 14px;

      opacity: 0;
      transform: translateY(20px);
    }

    .pnum {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .wip-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;

      color: #F59E0B;

      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);

      border-radius: 100px;
      padding: 5px 12px;
    }

    .wip-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #F59E0B;

      animation: blink 2.2s ease infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .pcard-mid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .pyear,
    .pname,
    .tags,
    .pmetrics {
      opacity: 0;
      transform: translateY(24px);
    }

    .pyear {
      font-size: 12px;
      color: var(--muted);
    }

    .pname {
      font-size: clamp(22px, 2.8vw, 40px);
      font-weight: 800;

      letter-spacing: -0.03em;
      line-height: 1.08;
    }

    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;

      padding: 4px 11px;

      border: 1px solid var(--border);
      border-radius: 100px;

      color: var(--muted);
    }

    .pmetrics {
      display: flex;
      gap: 32px;
    }

    .pmetric {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .pm-val {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .pm-label {
      font-size: 11px;
      color: var(--muted);

      line-height: 1.35;
      max-width: 130px;
    }

    /* =========================
       RIGHT
    ========================= */

    .pcard-vis {
      position: relative;
      overflow: hidden;
    }

    .pcard-bg {
      position: absolute;
      inset: 0;

      background: linear-gradient(
        145deg,
        #001209 0%,
        #003D1A 55%,
        #00C96B 100%
      );
    }

    .pcard-img {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      z-index: 1;

      transform: scale(1.15);

      transition: transform 0.9s cubic-bezier(0.25,0.46,0.45,0.94);
    }

    .pcard:hover .pcard-img {
      transform: scale(1.06);
    }

    .pcard-img-overlay {
      position: absolute;
      inset: 0;

      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.45) 100%
      );

      z-index: 2;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {
      .pcard-inner {
        grid-template-columns: 1fr;
      }

      .pcard-vis {
        height: 240px;
        order: -1;
      }

      .pcard-info {
        padding: 28px 24px;
      }
    }
  </style>
</head>

<body>

  <article class="pcard">

    <div class="pcard-inner">

      <div class="pcard-info">

        <div class="pcard-top">
          <span class="pnum">02</span>

          <span class="wip-badge">
            <span class="wip-badge-dot"></span>
            Work in progress
          </span>
        </div>

        <div class="pcard-mid">

          <p class="pyear">
            NeoTaste / 2025 - 2026
          </p>

          <h3 class="pname">
            Finding the right incentive to double referral volume
          </h3>

          <div class="tags">
            <span class="tag">Growth</span>
            <span class="tag">A/B Testing</span>
          </div>

        </div>

        <div class="pmetrics">

          <div class="pmetric">
            <span class="pm-val">+148%</span>

            <span class="pm-label">
              Total referral<br>
              volume growth
            </span>
          </div>

          <div class="pmetric">
            <span class="pm-val">5.2%</span>

            <span class="pm-label">
              Final referral rate<br>
              (was 2.1%)
            </span>
          </div>

        </div>

      </div>

      <div class="pcard-vis">

        <div class="pcard-bg"></div>

        <img
          class="pcard-img"
          src="images/referral-case.webp"
          alt="Referral cover"
        >

        <div class="pcard-img-overlay"></div>

      </div>

    </div>

  </article>

  <script>
    const tl = gsap.timeline();

    tl.to(".pcard", {
      opacity: 1,
      y: 0,
      duration: 1.1,
      ease: "power4.out"
    });

    tl.to(".pcard-top", {
      opacity: 1,
      y: 0,
      duration: 0.7,
      ease: "power3.out"
    }, "-=0.6");

    tl.to(".pyear", {
      opacity: 1,
      y: 0,
      duration: 0.7,
      ease: "power3.out"
    }, "-=0.45");

    tl.to(".pname", {
      opacity: 1,
      y: 0,
      duration: 0.9,
      ease: "power4.out"
    }, "-=0.45");

    tl.to(".tags", {
      opacity: 1,
      y: 0,
      duration: 0.6,
      ease: "power3.out"
    }, "-=0.55");

    tl.to(".pmetrics", {
      opacity: 1,
      y: 0,
      duration: 0.8,
      ease: "power3.out"
    }, "-=0.45");

    tl.to(".pcard-img", {
      scale: 1,
      duration: 1.4,
      ease: "power3.out"
    }, "-=1.2");
  </script>

</body>
</html>
